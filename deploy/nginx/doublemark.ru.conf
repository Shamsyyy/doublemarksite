# /etc/nginx/sites-available/doublemark.ru
# SSL blocks are managed by Certbot; keep certificate paths when editing.

server {
    server_name doublemark.ru www.doublemark.ru;

    root /var/www/doublemark;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location /downloads/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location /updates/ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/doublemark.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/doublemark.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name api.doublemark.ru;

    location = / {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"service":"DoubleMark.Api","health":"/health"}';
    }

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/doublemark.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/doublemark.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.doublemark.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = doublemark.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name doublemark.ru www.doublemark.ru;
    return 404; # managed by Certbot
}

server {
    if ($host = api.doublemark.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name api.doublemark.ru;
    return 404; # managed by Certbot
}
