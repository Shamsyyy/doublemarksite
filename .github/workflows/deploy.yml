name: Deploy to doublemark.ru

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync logos from dist/Photo when present
        run: |
          if [ -d dist/Photo ]; then
            cp -f dist/Photo/*.png public/brand/doublemark-logo.png 2>/dev/null || true
            cp -f dist/Photo/*.png public/brand/doublemark-favicon.png 2>/dev/null || true
            cp -f dist/Photo/*.ico public/brand/doublemark-logo.ico 2>/dev/null || true
            cp -f dist/Photo/*.ico public/favicon.ico 2>/dev/null || true
          fi

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_BACKEND: local
          VITE_API_BASE_URL: https://api.doublemark.ru

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "dist/*,dist/assets/*,dist/brand/*,dist/downloads/*,dist/downloads/archive/*,dist/updates/*"
          target: ${{ secrets.DEPLOY_PATH || '/var/www/doublemark' }}
          strip_components: 1
          overwrite: true

      - name: Fix remote permissions
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            mkdir -p ${{ secrets.DEPLOY_PATH || '/var/www/doublemark' }}
            chown -R www-data:www-data ${{ secrets.DEPLOY_PATH || '/var/www/doublemark' }} || true
