name: Ruflo release check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release validation
        run: npm run release:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test
